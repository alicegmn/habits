name: Deploy Simple API to Azure

on:
  push:
    branches:
      - simple-main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: simple-api

    steps:
      # Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Create dynamic tag like simple-main-abcd123
      - name: Set version tag
        run: echo "TAG=simple-main-${GITHUB_SHA::7}" >> $GITHUB_ENV

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build --target production \
          --platform linux/amd64 \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }} \
          ./simple-server

      - name: Compare Docker image sizes (detailed)
        run: |
          echo "=== Docker image size comparison ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep simple-server

      # Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}

      # Login to Azure
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Deploy to Azure App Service
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: simple-server-app
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
