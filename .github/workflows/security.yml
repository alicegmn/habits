name: Security Scan (Snyk)

on:
    push:
        branches: [main, develop, alice]
    pull_request:
        branches: [main, develop, alice]
    schedule:
        - cron: "0 3 * * *" # körs även varje natt kl 03:00 för regelbunden scanning

jobs:
    snyk:
        name: 🔍 Snyk Security Scan
        runs-on: ubuntu-latest

        strategy:
            matrix:
                service: ["frontend", "backend"] # Lägg till fler om du har t.ex. common/

        steps:
            - name: 🛒 Checkout repository
              uses: actions/checkout@v4

            - name: ⚙️ Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"

            - name: 📦 Install dependencies
              working-directory: ${{ matrix.service }}
              run: npm ci

            - name: 🧩 Install Snyk CLI
              run: npm install -g snyk

            - name: 🔐 Run Snyk test
              working-directory: ${{ matrix.service }}
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              run: snyk test --severity-threshold=high --all-projects

            - name: 📊 Monitor project in Snyk (optional, for dashboard)
              if: always()
              working-directory: ${{ matrix.service }}
              env:
                  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
              run: snyk monitor --all-projects --org="chas-advance"
