name: Simple API CI/CD

on:
    push:
        branches: ["simple"]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            # Checkout code
            - uses: actions/checkout@v4

            # Log in to Azure
            - name: Azure Login
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            # Log in to container registry (Docker Hub or ACR)
            - name: Log in to Docker Registry
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_PASSWORD }}

            # Build Docker image
            - name: Build Docker image
              run: |
                  docker build -t ${{ secrets.DOCKER_USERNAME }}/simple-api:latest ./simple-server

            # Push Docker image
            - name: Push Docker image
              run: |
                  docker push ${{ secrets.DOCKER_USERNAME }}/simple-api:latest

            # Deploy to Azure Web App (Container)
            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v3
              with:
                  app-name: "simple-api"
                  images: "${{ secrets.DOCKER_USERNAME }}/simple-api:latest"
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  WEBSITES_PORT: 3000
