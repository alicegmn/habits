name: Simple Frontend CI/CD

on:
  push:
    branches:
      - "simple*" # lint/test/build on all simple-* branches
    paths:
      - "simple-frontend/**"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      # deploys Azure SWA from these two branches:
      - simple-dev
      - simple-main
    paths:
      - "simple-frontend/**"

jobs:
  # --- LINT, TEST & BUILD ---
  build_lint_test:
    runs-on: ubuntu-latest
    name: Lint, Test & Build Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: simple-frontend/package-lock.json

      - name: Install dependencies
        working-directory: simple-frontend
        run: npm ci

      - name: Run ESLint
        working-directory: simple-frontend
        run: npm run lint

      - name: Run tests
        working-directory: simple-frontend
        run: npm test

      - name: Build frontend
        working-directory: simple-frontend
        run: npm run build

  # --- DEPLOY PREVIEW ENV ON PR ---
  deploy_preview:
    runs-on: ubuntu-latest
    needs: build_lint_test
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    name: Deploy PR Preview

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set environment info
        run: |
          if [[ "${GITHUB_BASE_REF}" == "simple-main" ]]; then
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_MUD_0E512F703 }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=Production (Preview)" >> $GITHUB_ENV
          else
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_GLACIER_08CFB2D03 }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=Staging (Preview)" >> $GITHUB_ENV
          fi

      - name: Deploy PR Preview to ${{ env.DEPLOY_ENV }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "simple-frontend"
          output_location: "dist"
          api_location: ""

  # --- DEPLOY PERMANENT ENV ON MERGE ---
  deploy_merge:
    runs-on: ubuntu-latest
    needs: build_lint_test
    if: github.event_name == 'push' && (github.ref_name == 'simple-main' || github.ref_name == 'simple-dev')
    name: Deploy Merged Code

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set environment info
        run: |
          if [[ "${GITHUB_REF_NAME}" == "simple-main" ]]; then
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_MUD_0E512F703 }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=Production" >> $GITHUB_ENV
          else
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_GLACIER_08CFB2D03 }}" >> $GITHUB_ENV
            echo "DEPLOY_ENV=Staging" >> $GITHUB_ENV
          fi

      - name: 🚀 Deploy to ${{ env.DEPLOY_ENV }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "simple-frontend"
          output_location: "dist"
          api_location: ""

  # --- CLOSE PREVIEW ON PR CLOSE ---
  close_pr_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: 🧹 Close PR Preview
    steps:
      - name: Select environment token
        run: |
          if [[ "${GITHUB_BASE_REF}" == "simple-main" ]]; then
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_MUD_0E512F703 }}" >> $GITHUB_ENV
          else
            echo "AZURE_TOKEN=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROUD_GLACIER_08CFB2D03 }}" >> $GITHUB_ENV
          fi

      - name: 🧹 Close PR Deployment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.AZURE_TOKEN }}
          action: "close"
