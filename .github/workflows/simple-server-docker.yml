name: Simple Server Docker CI/CD

on:
  push:
    branches:
      - simple

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Test Docker build (CI stage)
        run: |
          docker build --target build \
            --platform linux/amd64 \
            -t simple-server-test \
            -f simple-server/Dockerfile simple-server

  build-and-push:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/simple-server"
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}

          echo "Tags:"
          echo "latest"
          echo "${BRANCH}"
          echo "${BRANCH}-${SHORT_SHA}"

          docker build --target production \
            --platform linux/amd64 \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${BRANCH}" \
            -t "$IMAGE:${BRANCH}-${SHORT_SHA}" \
            -f simple-server/Dockerfile simple-server

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${BRANCH}"
          docker push "$IMAGE:${BRANCH}-${SHORT_SHA}"
