name: Deploy Simple Server to Azure

on:
    push:
        branches:
            - simple-main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        env:
            IMAGE_NAME: simple-api

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            # Build Docker image & push to Docker Hub
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Set version tag
              id: vars
              run: echo "TAG=simple-main-${GITHUB_SHA::7}" >> $GITHUB_ENV

            - name: Build Docker image
              run: |
                  docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${TAG} ./simple-server

            - name: Push Docker image
              run: |
                  docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${TAG}

            # Deploy to Azure App Service
            - name: Azure Login
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Deploy to Azure Web App
              uses: azure/webapps-deploy@v2
              with:
                  app-name: YOUR_APP_SERVICE_NAME
                  images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${TAG}
