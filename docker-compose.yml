services:
  api:
    build: ./simple-server
    container_name: simple_api
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build: ./simple-frontend
    container_name: simple_frontend
    restart: always
    environment:
      VITE_API_URL: http://api:3000
    depends_on:
      - api
    ports:
      - "8080:80"
